<text x="460.0" y="589.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">Each pass leaves more skills held, so the next path waives more and takes less time.</text>
<text x="460.0" y="604.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">A private LP is tracked and credited like any other; it issues course certificates and</text>
<text x="460.0" y="619.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">skill badges, but no programme certificate.</text>
<text x="40.0" y="671.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">A skill is held when a tagged course completes, when every question tagged with it is answered at full marks in the learner&#x27;s best attempt, or when an</text>
<text x="40.0" y="686.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">external credential is imported. There are no levels and no cut-scores, so waiving is a set-subset test and the gap is a set difference.</text>
</svg>
