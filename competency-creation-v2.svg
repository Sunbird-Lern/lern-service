<text x="40.0" y="586.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">7       programme owner</text>
<text x="40.0" y="601.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">8       automatic, at publish</text>
<text x="40.0" y="616.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">9       platform admin</text>
<text x="910.0" y="503.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">Step 8 does not block publish.</text>
<text x="910.0" y="518.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">It names the role skills no</text>
<text x="910.0" y="533.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">course in the path teaches,</text>
<text x="910.0" y="548.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">while that is still cheap to fix.</text>
<text x="40.0" y="655.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">Steps 3 and 4 are the same engine behind three front-ends — workbook, YAML in git, and an LLM draft from the source document. All three emit the one spec.</text>
<text x="40.0" y="670.4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" style="white-space:pre">Apply is idempotent and resumable: re-running it against an unchanged spec writes nothing. It refuses code renames and never deletes a term.</text>
